[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cashproof"
version = "0.2.0"
description = "Local video evidence review service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.143.3", "starlette==1.8.0", "pydantic==2.12.3", "uvicorn==0.37.0",
  "python-multipart==0.0.32", "pillow==11.3.0", "av==16.0.1",
  "jsonschema==4.25.1", "imageio-ffmpeg==0.6.0",
  "transformers==4.57.1", "huggingface-hub==0.36.0",
  "torch==2.8.0", "torchvision==0.23.0", "accelerate==1.11.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
